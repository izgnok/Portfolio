name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Gradle 캐싱
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Backend 빌드 (Gradle)
      - name: Build Backend with Gradle
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean build -x test

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Backend Docker 이미지 빌드 & Push
      - name: Build and Push Backend Docker Image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest

      # 7. Frontend 빌드 (환경 변수 주입)
      - name: Build Frontend
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          cd frontend
          npm install
          npm run build

      # 8. EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/portfolio

            # .env 파일 생성
            echo "${{ secrets.ENV_FILE }}" > .env

            # docker-compose.yml 생성
            cat > docker-compose.yml << 'EOF'
            version: '3.8'

            services:
              mysql:
                image: mysql:8.0
                container_name: portfolio-mysql
                environment:
                  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
                  MYSQL_DATABASE: ${MYSQL_DATABASE}
                  MYSQL_USER: ${MYSQL_USER}
                  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
                ports:
                  - "3306:3306"
                volumes:
                  - mysql-data:/var/lib/mysql
                networks:
                  - portfolio-network
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/portfolio-backend:latest
                container_name: portfolio-backend
                environment:
                  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
                  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
                  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
                  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
                ports:
                  - "8081:8080"
                depends_on:
                  mysql:
                    condition: service_healthy
                networks:
                  - portfolio-network

            networks:
              portfolio-network:
                driver: bridge

            volumes:
              mysql-data:
            EOF

            # Backend 컨테이너 중지 및 삭제
            docker compose stop backend
            docker compose rm -f backend

            # 최신 이미지 Pull
            docker compose pull backend

            # 컨테이너 재시작
            docker compose up -d backend

            # 오래된 이미지 정리
            docker image prune -af

            # 배포 상태 확인
            echo "=== Deployment Complete ==="
            docker ps
            echo "=== Backend Logs ==="
            docker logs --tail 30 portfolio-backend

      # 9. Frontend 파일 EC2로 전송
      - name: Deploy Frontend to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/*"
          target: "/tmp/frontend-deploy"
          strip_components: 2

      # 10. Frontend 파일 배포
      - name: Move Frontend files to web root
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 파일 백업
            if [ -d "/var/www/html.backup" ]; then
              sudo rm -rf /var/www/html.backup
            fi
            if [ -d "/var/www/html" ] && [ "$(ls -A /var/www/html)" ]; then
              sudo mv /var/www/html /var/www/html.backup
            fi

            # 새 파일 배포
            sudo mkdir -p /var/www/html
            sudo cp -r /tmp/frontend-deploy/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html

            # 임시 파일 정리
            rm -rf /tmp/frontend-deploy

            echo "=== Frontend Deployment Complete ==="
            ls -la /var/www/html
